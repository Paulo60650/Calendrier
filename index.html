<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendrier Partagé - Paul & Diane</title>
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="Calendrier partagé pour Paul et Diane avec synchronisation en temps réel et rappels.">
  <link rel="manifest" id="manifest-placeholder">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .gradient-common { background: linear-gradient(135deg, var(--color-paul, #3b82f6), var(--color-diane, #ec4899)); }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased pb-20 selection:bg-indigo-500 selection:text-white">

  <!-- TOP HEADER -->
  <header class="sticky top-0 z-30 bg-slate-800/80 backdrop-blur-md border-b border-slate-700/60 px-4 py-3 flex items-center justify-between shadow-lg">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400 font-bold shadow-inner">
        <i data-lucide="calendar"></i>
      </div>
      <div>
        <h1 class="text-lg font-bold text-white leading-tight">Notre Agenda</h1>
        <p id="header-user-status" class="text-xs text-slate-400 flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span>Chargement...</span>
        </p>
      </div>
    </div>
    
    <div class="flex items-center space-x-2">
      <button id="btn-notifications" class="p-2.5 rounded-xl bg-slate-700/50 hover:bg-slate-700 text-slate-300 transition-colors border border-slate-600/40 relative">
        <i data-lucide="bell" class="w-5 h-5"></i>
        <span id="notif-badge" class="hidden absolute top-1 right-1 w-2.5 h-2.5 bg-rose-500 rounded-full"></span>
      </button>
      <button id="btn-settings" class="p-2.5 rounded-xl bg-slate-700/50 hover:bg-slate-700 text-slate-300 transition-colors border border-slate-600/40">
        <i data-lucide="settings" class="w-5 h-5"></i>
      </button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 max-w-xl w-full mx-auto p-4 flex flex-col gap-4">

    <!-- USER IDENTIFICATION & COLOR SELECTOR MODAL (First Time Launch) -->
    <div id="modal-welcome" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 hidden">
      <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 w-full max-w-md shadow-2xl space-y-6">
        <div class="text-center space-y-2">
          <div class="w-16 h-16 bg-indigo-600/20 text-indigo-400 rounded-2xl mx-auto flex items-center justify-center text-2xl border border-indigo-500/30">
            <i data-lucide="users"></i>
          </div>
          <h2 class="text-2xl font-bold text-white">Bienvenue !</h2>
          <p class="text-sm text-slate-400">Qui utilise cet appareil ? Choisissez votre profil pour personnaliser vos couleurs.</p>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <button type="button" onclick="selectUser('paul')" id="select-paul" class="p-4 rounded-xl border-2 border-slate-700 bg-slate-800 hover:border-blue-500 transition-all text-center flex flex-col items-center gap-2">
            <div class="w-12 h-12 rounded-full bg-blue-500/20 text-blue-400 flex items-center justify-center font-bold text-lg">P</div>
            <span class="font-semibold text-white">Paul</span>
          </button>
          <button type="button" onclick="selectUser('diane')" id="select-diane" class="p-4 rounded-xl border-2 border-slate-700 bg-slate-800 hover:border-pink-500 transition-all text-center flex flex-col items-center gap-2">
            <div class="w-12 h-12 rounded-full bg-pink-500/20 text-pink-400 flex items-center justify-center font-bold text-lg">D</div>
            <span class="font-semibold text-white">Diane</span>
          </button>
        </div>

        <div id="color-picker-section" class="space-y-4 pt-4 border-t border-slate-700/60 hidden">
          <h3 class="text-sm font-semibold text-slate-300">Choix de la couleur :</h3>
          <div class="grid grid-cols-5 gap-3" id="color-palette">
            <!-- Dynamic Color Palette -->
          </div>
          <button id="btn-save-profile" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-xl text-white transition-colors shadow-lg shadow-indigo-600/30">
            Valider et Continuer
          </button>
        </div>
      </div>
    </div>

    <!-- CALENDAR TOOLBAR & MONTH NAVIGATION -->
    <div class="bg-slate-800/60 border border-slate-700/50 rounded-2xl p-4 flex items-center justify-between shadow-md">
      <button id="btn-prev-month" class="p-2 hover:bg-slate-700/60 rounded-lg text-slate-300 transition-colors">
        <i data-lucide="chevron-left" class="w-5 h-5"></i>
      </button>
      <div class="text-center">
        <h2 id="current-month-year" class="text-lg font-bold text-white capitalize">Octobre 2026</h2>
        <p class="text-xs text-indigo-400 font-medium cursor-pointer" onclick="goToToday()">Aujourd'hui</p>
      </div>
      <button id="btn-next-month" class="p-2 hover:bg-slate-700/60 rounded-lg text-slate-300 transition-colors">
        <i data-lucide="chevron-right" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- COLOR LEGEND -->
    <div class="flex items-center justify-center gap-4 text-xs font-medium text-slate-400 bg-slate-800/30 p-2.5 rounded-xl border border-slate-800">
      <div class="flex items-center gap-1.5">
        <span id="legend-paul" class="w-3 h-3 rounded-full bg-blue-500"></span>
        <span>Paul</span>
      </div>
      <div class="flex items-center gap-1.5">
        <span id="legend-diane" class="w-3 h-3 rounded-full bg-pink-500"></span>
        <span>Diane</span>
      </div>
      <div class="flex items-center gap-1.5">
        <span class="w-3 h-3 rounded-full bg-purple-500"></span>
        <span>Commun</span>
      </div>
    </div>

    <!-- CALENDAR GRID -->
    <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-3 shadow-xl">
      <div class="grid grid-cols-7 gap-1 text-center font-semibold text-xs text-slate-400 mb-2">
        <div>Lun</div><div>Mar</div><div>Mer</div><div>Jeu</div><div>Ven</div><div>Sam</div><div>Dim</div>
      </div>
      <div id="calendar-days" class="grid grid-cols-7 gap-1.5">
        <!-- Dynamic Calendar Grid -->
      </div>
    </div>

    <!-- UPCOMING EVENTS LIST -->
    <div class="space-y-3 pt-2">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
          <i data-lucide="list-todo" class="w-4 h-4 text-indigo-400"></i> Prochains événements
        </h3>
        <span id="events-count" class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full border border-slate-700">0</span>
      </div>
      <div id="events-list" class="space-y-2.5">
        <!-- Events list populated dynamically -->
      </div>
    </div>

  </main>

  <!-- ADD / EDIT EVENT MODAL -->
  <div id="modal-event" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
    <div class="bg-slate-800 border-t sm:border border-slate-700 rounded-t-3xl sm:rounded-2xl p-6 w-full max-w-md shadow-2xl space-y-4 animate-in slide-in-from-bottom duration-200">
      <div class="flex items-center justify-between">
        <h3 id="modal-event-title" class="text-lg font-bold text-white">Nouvel Événement</h3>
        <button onclick="closeEventModal()" class="text-slate-400 hover:text-white p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="form-event" class="space-y-4">
        <input type="hidden" id="event-id">
        
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Titre de l'événement</label>
          <input type="text" id="event-title" required placeholder="Ex: Restaurant, Médecin..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus
